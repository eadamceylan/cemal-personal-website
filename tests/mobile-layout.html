<!doctype html>
<meta charset="utf-8">
<title>Mobile layout probe</title>
<body
  data-ready="pending"
  data-viewport-width="0"
  data-scroll-width="0"
  data-nav-right="0"
  data-hero-right="0"
  data-actions-right="0"
  data-basketball-focal-x="0"
  data-taekwondo-focal-x="0"
  data-header-bottom="0"
  data-basketball-head-y="0"
  data-taekwondo-head-y="0"
  data-logo-present="false"
  data-logo-height="0"
  data-logo-bottom="0"
>
<iframe id="site" title="Mobile website test"></iframe>
<script>
  const params = new URLSearchParams(location.search);
  const width = Number(params.get("width")) || 320;
  const scene = params.get("scene");
  const frame = document.querySelector("#site");
  frame.style.width = `${width}px`;
  frame.style.height = "800px";
  frame.src = "../index.html";

  frame.addEventListener("load", () => {
    const view = frame.contentWindow;
    const doc = frame.contentDocument;
    const rect = (selector) => {
      const bounds = doc.querySelector(selector).getBoundingClientRect();
      return { left: bounds.left, right: bounds.right, width: bounds.width };
    };
    const focalPoint = (selector, sourceXRatio, sourceYRatio) => {
      const image = doc.querySelector(selector);
      const bounds = image.getBoundingClientRect();
      const scale = Math.max(
        bounds.width / image.naturalWidth,
        bounds.height / image.naturalHeight
      );
      const renderedWidth = image.naturalWidth * scale;
      const renderedHeight = image.naturalHeight * scale;
      const [positionX, positionY] = getComputedStyle(image).objectPosition
        .split(" ")
        .map(Number.parseFloat);
      const renderedLeft = bounds.left + (bounds.width - renderedWidth) * positionX / 100;
      const renderedTop = bounds.top + (bounds.height - renderedHeight) * positionY / 100;
      return {
        x: renderedLeft + renderedWidth * sourceXRatio,
        y: renderedTop + renderedHeight * sourceYRatio
      };
    };

    const basketball = focalPoint(
      ".basketball-chapter .chapter-media",
      0.735,
      0.105
    );
    const taekwondo = focalPoint(
      ".taekwondo-chapter .chapter-media",
      0.24,
      0.11
    );
    const logo = doc.querySelector(".brand img");

    document.body.dataset.ready = "true";
    document.body.dataset.viewportWidth = String(view.innerWidth);
    document.body.dataset.scrollWidth = String(doc.documentElement.scrollWidth);
    document.body.dataset.navRight = String(rect("nav").right);
    document.body.dataset.heroRight = String(rect("h1").right);
    document.body.dataset.actionsRight = String(rect(".actions").right);
    document.body.dataset.basketballFocalX = String(basketball.x);
    document.body.dataset.taekwondoFocalX = String(taekwondo.x);
    document.body.dataset.headerBottom = String(
      doc.querySelector(".bar").getBoundingClientRect().bottom
    );
    document.body.dataset.basketballHeadY = String(
      basketball.y - doc.querySelector(".basketball-chapter").getBoundingClientRect().top
    );
    document.body.dataset.taekwondoHeadY = String(
      taekwondo.y - doc.querySelector(".taekwondo-chapter").getBoundingClientRect().top
    );
    if (logo) {
      const logoBounds = logo.getBoundingClientRect();
      document.body.dataset.logoPresent = "true";
      document.body.dataset.logoHeight = String(logoBounds.height);
      document.body.dataset.logoBottom = String(logoBounds.bottom);
    }
    if (scene) {
      doc.documentElement.style.scrollBehavior = "auto";
      doc.querySelector(`#${scene}`)?.scrollIntoView({ behavior: "instant" });
    }
  });
</script>
</body>
